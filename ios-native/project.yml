# The native iPhone app (docs/native-ios.md). Generate the Xcode project with `xcodegen generate`
# here, or build and install with ../scripts/build-ios-native.sh. The web-view app in ../ios is separate.
name: HouseNative
options:
  bundleIdPrefix: dev.riley
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  HouseNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: House
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts: [Urbanist.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: House talks to the House Control hub, and straight to your TV, over this Wi-Fi network to switch your lights, air conditioner and TV.
        NSMicrophoneUsageDescription: House listens when you tap the mic, so you can tell the house what to do.
        NSSpeechRecognitionUsageDescription: House turns what you say into a request for the house, on this iPhone when it can.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.riley.HouseControl
            CFBundleURLSchemes: [housenative]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.riley.HouseControl
        PRODUCT_NAME: HouseNative
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  HouseNative:
    build:
      targets:
        HouseNative: all
    run:
      config: Debug
    archive:
      config: Release
