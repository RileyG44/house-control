# Builds the Windows widget (windows/) on GitHub's machines and publishes each new version.
#
#   Push a change under windows/ → the installer and the portable .exe as a downloadable artifact.
#   If windows/package.json has a version with no release yet, it is also published as the
#   release win-v<version> with latest.yml, which installed copies of the app check for and
#   update themselves from. Bump the version to ship an update; other pushes just build.
#
# Unsigned: Windows SmartScreen asks once at install ("More info" → "Run anyway").

name: Windows app

on:
  push:
    branches: ["**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write  # publish the release
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the installer and the portable .exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Keep the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HouseControl-Windows
          path: |
            windows/dist/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="win-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released; bump the version in windows/package.json to ship an update."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "House Control for Windows $version" \
            --notes "Installed copies update themselves. New install: download **HouseControl-Setup-$version.exe** below (Windows asks once: More info → Run anyway)." \
            "dist/HouseControl-Setup-$version.exe" "dist/HouseControl-Setup-$version.exe.blockmap" \
            "dist/HouseControl-$version-portable.exe" dist/latest.yml
