<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>House Control</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #e8eefc; }
  body { box-sizing: border-box; padding: 14px; display: grid; }
  .card {
    border-radius: 34px; overflow: hidden; position: relative;
    background: radial-gradient(120% 60% at 50% 0%, rgba(70, 100, 170, 0.28), transparent 70%),
                linear-gradient(180deg, rgba(16, 21, 38, 0.97), rgba(9, 12, 23, 0.97));
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1) inset, 0 10px 22px -8px rgba(0, 0, 0, 0.6), 0 2px 8px -2px rgba(0, 0, 0, 0.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 34px;
  }
  .drag { position: absolute; inset: 0 0 auto 0; height: 64px; -webkit-app-region: drag; }
  .close { position: absolute; top: 18px; right: 18px; -webkit-app-region: no-drag; width: 34px; height: 34px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #cfe0ff; font-size: 18px; cursor: pointer; }
  .badge { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); margin-bottom: 22px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 6px; color: rgba(220, 230, 255, 0.68); }
  code { font: 12px Consolas, monospace; color: #b8c8ee; word-break: break-all; }
  .buttons { display: grid; gap: 10px; width: 100%; max-width: 280px; margin-top: 26px; }
  button.b { font: inherit; color: inherit; cursor: pointer; padding: 11px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); }
  button.b:hover { background: rgba(255,255,255,0.12); }
  button.primary { background: #4c7dff; border-color: #4c7dff; color: #fff; }
  button.primary:hover { background: #5d8bff; }
  .muted { margin-top: 18px; font-size: 12px; color: rgba(220, 230, 255, 0.45); }
</style>
</head>
<body>
<div class="card">
  <div class="drag"></div>
  <button class="close" title="Hide (Esc)" id="close">×</button>
  <div class="badge">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
  </div>
  <h1>Can't reach the hub</h1>
  <p>The hub on the Mac didn't answer at</p>
  <p><code id="hub"></code></p>
  <p><code id="reason"></code></p>
  <div class="buttons">
    <button class="b primary" id="retry">Try again</button>
    <button class="b" id="other"></button>
  </div>
  <div class="muted">Retrying on its own every 15 seconds. Tailscale needs this PC signed in to the same tailnet.</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const hub = q.get('hub') || '';
  document.getElementById('hub').textContent = hub;
  document.getElementById('reason').textContent = q.get('reason') || '';
  const other = hub === q.get('lan') ? { label: 'Use Tailscale instead', url: q.get('tailscale') } : { label: 'Use home Wi-Fi (LAN) instead', url: q.get('lan') };
  const otherButton = document.getElementById('other');
  otherButton.textContent = other.label;
  otherButton.onclick = () => window.houseWindow.useHub(other.url);
  document.getElementById('retry').onclick = () => window.houseWindow.retry();
  document.getElementById('close').onclick = () => window.houseWindow.hide();
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.houseWindow.hide(); });
</script>
</body>
</html>
