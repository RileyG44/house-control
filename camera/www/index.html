<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio Camera">
<title>Studio Camera</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f4f1ea;
    --dim: #ffffff9c;
    --line: #ffffff1f;
    --glass: #13131599;
    --live: #4ad07c;
    --down: #e5645a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; background: #000; }
  camera-view { display: block; width: 100%; height: 100%; }
  #stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  header, footer {
    position: fixed; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center;
    transition: opacity .35s ease;
  }
  header {
    top: 0; gap: 9px;
    padding: max(16px, env(safe-area-inset-top)) 18px 30px;
    background: linear-gradient(#000000bd, #0000);
    pointer-events: none;
  }
  footer {
    bottom: 0; justify-content: center; gap: 8px;
    padding: 34px 18px max(18px, env(safe-area-inset-bottom));
    background: linear-gradient(#0000, #000000bd);
  }
  body.idle header, body.idle footer { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ffffff4d; flex: none; }
  .dot.live { background: var(--live); animation: beat 2.4s ease-out infinite; }
  .dot.down { background: var(--down); }
  @keyframes beat {
    0% { box-shadow: 0 0 0 0 #4ad07c66; }
    60%, 100% { box-shadow: 0 0 0 7px #4ad07c00; }
  }

  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .chip {
    margin-left: auto;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #ffffff0f;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
  .chip.down { color: #ffb8b2; border-color: #e5645a59; }

  button {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--glass);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  button:hover { background: #1d1d20cc; }
  button:active { transform: scale(.98); }
  button svg { width: 15px; height: 15px; }
  button span { letter-spacing: .01em; }

  #empty {
    position: fixed; inset: 0; z-index: 1;
    display: grid; place-items: center;
    padding: 32px;
    text-align: center;
    background: #0b0b0c;
    transition: opacity .5s ease, visibility .5s;
  }
  #empty.gone { opacity: 0; visibility: hidden; }
  #empty .ring {
    width: 34px; height: 34px; margin: 0 auto 18px;
    border: 1px solid #ffffff2e;
    border-top-color: #ffffffbf;
    border-radius: 50%;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(1turn); } }
  #empty h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  #empty p { margin: 0; max-width: 30ch; color: var(--dim); font-size: 12.5px; line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) {
    .dot.live, #empty .ring { animation: none; }
  }
</style>
</head>
<body>

<div id="stage"><camera-view></camera-view></div>

<div id="empty">
  <div>
    <div class="ring"></div>
    <h2>Waiting for the camera</h2>
    <p>The feed starts as soon as the camera is on the network and streaming.</p>
  </div>
</div>

<header>
  <span class="dot" id="dot"></span>
  <h1>Studio</h1>
  <span class="chip" id="chip">Connecting</span>
</header>

<footer>
  <button id="snap" title="Save a still (S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 7.5h3.2L8 5.2h8l1.8 2.3H21v11H3z"/><circle cx="12" cy="12.7" r="3.4"/>
    </svg>
    <span>Snapshot</span>
  </button>
  <button id="full" title="Full screen (F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>
    </svg>
    <span>Full screen</span>
  </button>
</footer>

<script type="module">
  import {VideoRTC} from './video-rtc.js';

  const dot = document.getElementById('dot');
  const chip = document.getElementById('chip');
  const empty = document.getElementById('empty');

  let everLive = false;

  function setState(state) {
    if (state === 'live') {
      everLive = true;
      dot.className = 'dot live';
      chip.className = 'chip';
      chip.textContent = 'Live';
      empty.classList.add('gone');
    } else if (state === 'down') {
      dot.className = 'dot down';
      chip.className = 'chip down';
      chip.textContent = 'Offline';
      if (!everLive) empty.classList.remove('gone');
    } else {
      dot.className = 'dot';
      chip.className = 'chip';
      chip.textContent = 'Connecting';
    }
  }

  class CameraView extends VideoRTC {
    oninit() {
      super.oninit();
      this.video.controls = false;
      this.video.muted = true;
      this.video.autoplay = true;
      this.video.setAttribute('playsinline', '');
      this.video.style.objectFit = 'contain';
      this.video.addEventListener('playing', () => setState('live'));
      this.video.addEventListener('waiting', () => setState('wait'));
      this.video.addEventListener('stalled', () => setState('wait'));
      this.video.addEventListener('error', () => setState('down'));
    }
  }

  customElements.define('camera-view', CameraView);

  const view = document.querySelector('camera-view');
  view.src = new URL('api/ws?src=camera', location.href);

  /* Chrome that gets out of the way. */
  let idleT;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => document.body.classList.add('idle'), 3200);
  }
  document.addEventListener('pointermove', wake);
  document.addEventListener('pointerdown', e => { if (!e.target.closest('button')) wake(); });
  wake();

  /* Full screen, with the iPhone's own video full screen as the fallback. */
  function fullScreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen?.();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      view.video?.webkitEnterFullscreen?.();
    }
  }
  document.getElementById('full').addEventListener('click', fullScreen);
  document.addEventListener('dblclick', fullScreen);

  /* A still from the same stream. */
  function snapshot() {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const a = document.createElement('a');
    a.href = new URL('api/frame.jpeg?src=camera&t=' + Date.now(), location.href);
    a.download = 'studio-' + stamp + '.jpg';
    a.click();
  }
  document.getElementById('snap').addEventListener('click', snapshot);

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'f' || e.key === 'F') fullScreen();
    if (e.key === 's' || e.key === 'S') snapshot();
  });
</script>
</body>
</html>
